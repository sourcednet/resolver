name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      # Sibling projects come from their tagged versions on GitHub.
      - run: go mod download
      - run: make lint test build
        env: {GOFLAGS: -mod=mod}
