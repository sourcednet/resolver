# sourced-resolver behind nginx, with TLS (certificates from Let's Encrypt,
# e.g. certbot --webroot). Replace resolver.example.net with the resolver's
# name, the one passed to `sourced-resolver serve -name`.
#
# Run the resolver on localhost, trusting nginx's X-Real-IP for rate limits:
#   sourced-resolver serve -name resolver.example.net -addr 127.0.0.1:8080 \
#     -data /var/lib/sourced-resolver -publisher example.org -only \
#     -client-ip-header X-Real-IP

server {
    listen 443 ssl;
    server_name resolver.example.net;

    ssl_certificate     /etc/letsencrypt/live/resolver.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resolver.example.net/privkey.pem;

    # Requests are small (a passage to verify is at most 64 KB).
    client_max_body_size 128k;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # MCP (Streamable HTTP) may answer as a server-sent event stream and
    # keep it open: don't buffer it, and allow long reads.
    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name resolver.example.net;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
